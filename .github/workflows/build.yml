name: Build macOS Menu Bar App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-menubar-${{ hashFiles('**/Cargo.toml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch app icon and generate all icon formats
        run: |
          curl -fsSL -H "Cache-Control: no-cache" -o /tmp/icon-src.png "https://raw.githubusercontent.com/aristeovaladezmontero-coder/reloj/main/icono-rio.png?nocache=$(date +%s)"
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          cat > /tmp/make_icons.py <<'EOF'
          from PIL import Image
          import os
          # Forzar RGBA (Tauri lo exige) y hacer el lienzo cuadrado
          src = Image.open('/tmp/icon-src.png').convert('RGBA')
          side = max(src.size)
          canvas = Image.new('RGBA', (side, side), (0, 0, 0, 0))
          canvas.paste(src, ((side - src.width) // 2, (side - src.height) // 2))
          canvas.resize((1024, 1024), Image.LANCZOS).save('src-tauri/icons/icon.png')
          canvas.resize((44, 44), Image.LANCZOS).save('src-tauri/icons/tray.png')
          os.makedirs('/tmp/icon.iconset', exist_ok=True)
          for s in [16, 32, 128, 256, 512]:
              canvas.resize((s, s), Image.LANCZOS).save(f'/tmp/icon.iconset/icon_{s}x{s}.png')
              canvas.resize((s * 2, s * 2), Image.LANCZOS).save(f'/tmp/icon.iconset/icon_{s}x{s}@2x.png')
          EOF
          python3 /tmp/make_icons.py
          iconutil -c icns /tmp/icon.iconset -o src-tauri/icons/icon.icns

      - name: Install Tauri CLI
        run: npm install

      - name: Build app
        run: npx tauri build --bundles app,dmg

      - name: Zip .app
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" app-macOS.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: menubar-app-macOS
          path: |
            app-macOS.zip
            src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 3

      - name: Publicar release con link de descarga público
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Río ENARM Aris — última versión"
          body: |
            Instalación en un comando (pega esto en Terminal):
            ```
            curl -fsSL https://raw.githubusercontent.com/aristeovaladezmontero-coder/cukcoo-enarm-aris/main/install.sh | bash
            ```
            O descarga el DMG de aquí abajo, arrastra la app a Aplicaciones y corre:
            `xattr -cr "/Applications/Río ENARM Aris.app"`
          files: |
            app-macOS.zip
            src-tauri/target/release/bundle/dmg/*.dmg
